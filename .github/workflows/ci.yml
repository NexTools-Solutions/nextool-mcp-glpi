name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: core
        working-directory: mcp-glpi-core
        run: npm ci && npm run build && npm test
      - name: server
        working-directory: mcp-glpi
        run: npm ci && npm run build && npm test
