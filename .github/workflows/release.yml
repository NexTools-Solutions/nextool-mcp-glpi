# Tag v<version> -> tests -> npm (with provenance) -> official MCP Registry.
#   npm: trusted publishing (OIDC, no token) once each package lists this repo + release.yml as a trusted publisher
#     on npmjs.com; until then the repository secret NPM_TOKEN is used. npm CLI >= 11.5.1 tries OIDC first and falls
#     back to the token, so the secret can be deleted after the first OIDC publish succeeds.
#   MCP Registry: DNS authentication for com.nextoolsolutions/* with repository secret MCP_PRIVATE_KEY
#     (Ed25519 private key seed in hex; public key in a TXT record on the apex of nextoolsolutions.com)
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # npm provenance
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version
      - name: test core
        working-directory: mcp-glpi-core
        run: npm ci && npm run build && npm test
      - name: test server
        working-directory: mcp-glpi
        run: npm ci && npm run build && npm test
      - name: tag matches server version
        run: test "v$(node -p "require('./mcp-glpi/package.json').version")" = "$GITHUB_REF_NAME"
      - name: publish to npm (skips versions already published)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for d in mcp-glpi-core mcp-glpi; do
            name=$(node -p "require('./$d/package.json').name"); ver=$(node -p "require('./$d/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then echo "$name@$ver already published"; continue; fi
            (cd "$d" && npm publish --provenance --access public)
          done
      - name: publish to the MCP Registry
        working-directory: mcp-glpi
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login dns --domain nextoolsolutions.com --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish
